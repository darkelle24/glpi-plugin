# Merge this into the existing GLPI service. Do not replace its other volumes.
# Replace 'glpi' if your existing service has a different name.
services:
  glpi:
    volumes:
      - type: bind
        source: ${GLPI_PLUGINS_HOST:?Set GLPI_PLUGINS_HOST}
        target: /var/www/glpi/plugins
        read_only: true
        bind:
          create_host_path: false
